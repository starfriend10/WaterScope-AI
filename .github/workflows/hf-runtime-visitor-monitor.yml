name: WaterScope HF Visitor Runtime Monitor

"on":
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  HF_SPACE_ID: EnvironmentalAI/WaterScopeAI
  DASHBOARD_ISSUE_TITLE: "WaterScope-AI — HF Runtime Status (Past 24 Hours)"
  ALERT_ISSUE_TITLE: "HF runtime alert: WaterScopeAI backend needs attention"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Monitor Hugging Face Space for up to 30 minutes
        id: hf
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          space_id = os.environ["HF_SPACE_ID"]
          url = "https://huggingface.co/api/spaces/" + urllib.parse.quote(space_id, safe="/")
          max_minutes = 30
          interval_seconds = 60

          final_result = "timeout"
          final_stage = "UNKNOWN"
          final_error = ""
          final_health = "other"
          final_icon = "⚪"

          def classify(stage, error_message):
              msg = (error_message or "").lower()
              target_error = (
                  stage == "RUNTIME_ERROR"
                  and (
                      "scheduling failure" in msg
                      or "not enough hardware capacity" in msg
                      or "unable to schedule" in msg
                  )
              )
              if stage == "RUNNING":
                  return "running", "🟢", target_error
              if stage == "RUNTIME_ERROR":
                  return "error", "🔴", target_error
              if "START" in stage or "BUILD" in stage or "SCHEDUL" in stage:
                  return "starting", "🟡", target_error
              if stage in {"PAUSED", "SLEEPING", "STOPPED"}:
                  return "inactive", "⚪", target_error
              return "other", "⚪", target_error

          for attempt in range(max_minutes + 1):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "WaterScope-AI-visitor-runtime-monitor",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)

                  runtime = data.get("runtime") or {}
                  stage = str(runtime.get("stage") or "UNKNOWN")
                  error_message = str(
                      runtime.get("errorMessage")
                      or runtime.get("error")
                      or data.get("errorMessage")
                      or ""
                  ).strip()
              except Exception as exc:
                  stage = "CHECK_ERROR"
                  error_message = f"{type(exc).__name__}: {exc}"

              health, icon, target_error = classify(stage, error_message)
              final_stage = stage
              final_error = error_message
              final_health = health
              final_icon = icon

              print(
                  f"[{attempt:02d} min] stage={stage} "
                  f"target_scheduling_error={target_error} "
                  f"error={error_message or '(none)'}",
                  flush=True,
              )

              if target_error:
                  final_result = "scheduling_failure"
                  break

              if stage == "RUNNING":
                  final_result = "running"
                  break

              if attempt < max_minutes:
                  time.sleep(interval_seconds)

          now_et = datetime.now(timezone.utc).astimezone(ZoneInfo("America/New_York"))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"result={final_result}\n")
              f.write(f"stage={final_stage}\n")
              f.write(f"health={final_health}\n")
              f.write(f"icon={final_icon}\n")
              f.write(f"timestamp_et={now_et.strftime('%Y-%m-%d %H:%M %Z')}\n")
              f.write("error_message<<EOF\n")
              f.write(final_error + "\n")
              f.write("EOF\n")
          PY

      - name: Find dashboard and open alert issue
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DASHBOARD_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title == "'"$DASHBOARD_ISSUE_TITLE"'") | .number' | head -n 1)"
          ALERT_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title == "'"$ALERT_ISSUE_TITLE"'") | .number' | head -n 1)"
          echo "dashboard_number=$DASHBOARD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "alert_number=$ALERT_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update rolling 24-hour dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_NUMBER: ${{ steps.issues.outputs.dashboard_number }}
          HF_RESULT: ${{ steps.hf.outputs.result }}
          HF_STAGE: ${{ steps.hf.outputs.stage }}
          HF_HEALTH: ${{ steps.hf.outputs.health }}
          HF_ICON: ${{ steps.hf.outputs.icon }}
          HF_ERROR: ${{ steps.hf.outputs.error_message }}
          HF_TIME_ET: ${{ steps.hf.outputs.timestamp_et }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          title = os.environ["DASHBOARD_ISSUE_TITLE"]
          issue_number = os.environ.get("DASHBOARD_NUMBER", "").strip()

          result = os.environ["HF_RESULT"]
          stage = os.environ["HF_STAGE"]
          health = os.environ["HF_HEALTH"]
          icon = os.environ["HF_ICON"]
          error = os.environ.get("HF_ERROR", "").strip()
          time_et = os.environ["HF_TIME_ET"]

          history = []
          if issue_number:
              viewed = subprocess.run(
                  ["gh", "issue", "view", issue_number, "--repo", repo, "--json", "body"],
                  check=True, capture_output=True, text=True,
              )
              old_body = json.loads(viewed.stdout).get("body") or ""
              sm = "<!-- WATERSCOPE_RUNTIME_HISTORY_START"
              em = "WATERSCOPE_RUNTIME_HISTORY_END -->"
              if sm in old_body and em in old_body:
                  hidden = old_body.split(sm, 1)[1].split(em, 1)[0].strip()
                  try:
                      history = json.loads(hidden)
                  except Exception:
                      history = []

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=24)
          kept = []
          for item in history:
              try:
                  ts = datetime.fromisoformat(item["timestamp_utc"].replace("Z", "+00:00"))
                  if ts >= cutoff:
                      kept.append(item)
              except Exception:
                  pass

          kept.append({
              "timestamp_utc": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "timestamp_et": time_et,
              "result": result,
              "stage": stage,
              "health": health,
              "icon": icon,
              "error": error,
          })
          kept = kept[-288:]

          counts = {
              "running": sum(1 for x in kept if x.get("result") == "running"),
              "scheduling_failure": sum(1 for x in kept if x.get("result") == "scheduling_failure"),
              "timeout": sum(1 for x in kept if x.get("result") == "timeout"),
          }

          lines = [
              "# WaterScope-AI HF Runtime — Past 24 Hours",
              "",
              f"**Current status:** {icon} `{stage}`  ",
              f"**Monitor result:** `{result}`  ",
              f"**Last checked:** {time_et}  ",
              f"**Space:** `{os.environ['HF_SPACE_ID']}`",
              "",
              "## Visitor-Triggered Summary",
              "",
              "| Result | Count |",
              "|---|---:|",
              f"| 🟢 Reached RUNNING within 30 min | {counts['running']} |",
              f"| 🔴 Explicit scheduling/capacity failure | {counts['scheduling_failure']} |",
              f"| 🟠 Not RUNNING after 30 min | {counts['timeout']} |",
              f"| **Checks stored** | **{len(kept)}** |",
              "",
              "> Checks are triggered by WaterScope-AI visitors, not by a periodic scheduler.",
              "> The monitor reads Hugging Face Hub runtime metadata and does not call the model API or wake the GPU.",
              "",
              "## History",
              "",
              "| Time (ET) | Monitor result | Runtime state | Error |",
              "|---|---|---|---|",
          ]

          for item in reversed(kept):
              err = (item.get("error") or "").replace("|", "\\|")
              if len(err) > 120:
                  err = err[:117] + "..."
              lines.append(
                  f"| {item['timestamp_et']} | {item.get('result', '—')} | "
                  f"{item.get('icon', '⚪')} {item.get('stage', 'UNKNOWN')} | {err} |"
              )

          lines += [
              "",
              "<!-- WATERSCOPE_RUNTIME_HISTORY_START",
              json.dumps(kept, ensure_ascii=False),
              "WATERSCOPE_RUNTIME_HISTORY_END -->",
          ]

          body_path = "/tmp/waterscope-runtime-dashboard.md"
          with open(body_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          if issue_number:
              subprocess.run(["gh", "issue", "edit", issue_number, "--repo", repo, "--body-file", body_path], check=True)
          else:
              subprocess.run(["gh", "issue", "create", "--repo", repo, "--title", title, "--body-file", body_path], check=True)
          PY

      - name: Create alert for a newly detected backend problem
        if: steps.hf.outputs.result != 'running' && steps.issues.outputs.alert_number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          HF_RESULT: ${{ steps.hf.outputs.result }}
          HF_STAGE: ${{ steps.hf.outputs.stage }}
          HF_ERROR: ${{ steps.hf.outputs.error_message }}
          HF_TIME_ET: ${{ steps.hf.outputs.timestamp_et }}
        shell: bash
        run: |
          if [ "$HF_RESULT" = "scheduling_failure" ]; then
            REASON="Hugging Face reported an explicit scheduling/capacity failure."
          else
            REASON="The Space did not reach RUNNING within 30 minutes after a visitor-triggered check."
          fi

          cat > /tmp/hf-alert.md <<EOF
          $REASON

          Space: $HF_SPACE_ID
          Monitor result: $HF_RESULT
          Runtime stage: $HF_STAGE
          Hugging Face message: ${HF_ERROR:-"(none)"}
          Detected: $HF_TIME_ET

          Manual intervention may be needed to restart the WaterScope-AI Hugging Face Space.
          EOF

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_ISSUE_TITLE" --body-file /tmp/hf-alert.md
          echo "::error::WaterScope-AI backend needs attention: $HF_RESULT / $HF_STAGE"
          exit 1

      - name: Existing backend alert already open
        if: steps.hf.outputs.result != 'running' && steps.issues.outputs.alert_number != ''
        run: |
          echo "A WaterScope-AI backend alert is already open."
          echo "No duplicate issue or duplicate failure notification is generated."

      - name: Close alert after recovery
        if: steps.hf.outputs.result == 'running' && steps.issues.outputs.alert_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ steps.issues.outputs.alert_number }}" --repo "$GITHUB_REPOSITORY" --comment "WaterScope-AI reached RUNNING during a visitor-triggered runtime check."

      - name: Runtime healthy
        if: steps.hf.outputs.result == 'running'
        run: |
          echo "WaterScope-AI reached RUNNING within the 30-minute monitoring window."
