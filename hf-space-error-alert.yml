name: HF Space Error Alert

on:
  repository_dispatch:
    types: [hf_space_error]

jobs:
  hf-space-error:
    runs-on: ubuntu-latest
    steps:
      - name: Show Hugging Face Space error
        run: |
          echo "WaterScope-AI Hugging Face Space reported an actual startup/model error."
          echo "Stage: ${{ github.event.client_payload.stage }}"
          echo "Type: ${{ github.event.client_payload.error_type }}"
          echo "Message: ${{ github.event.client_payload.message }}"
          echo "Time (UTC): ${{ github.event.client_payload.timestamp_utc }}"

      - name: Mark alert workflow as failed
        run: |
          echo "Failing this workflow intentionally so GitHub can send a failure notification."
          exit 1
